# Local deployment overrides for the GB10 (aarch64 + NVIDIA GB10).
# - Runs Ollama locally for embeddings with bge-m3 (multilingual, good Arabic retrieval; 1024-dim vectors).
# - Uses the host's gemma4-gb10-vllm (~/gemma-gb10, port 8000) as the LLM instead of Google Gemini.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: zakerly_ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - zakerly_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10

  ingestion-service:
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_EMBEDDING_MODEL=bge-m3
      - EMBEDDING_DIMENSION=1024
      - LLM_BASE_URL=http://host.docker.internal:8000/v1
      - LLM_MODEL_NAME=/models/gemma-4-26B-A4B-it
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_healthy
  chat-service:
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_EMBEDDING_MODEL=bge-m3
      - EMBEDDING_DIMENSION=1024
      - LLM_BASE_URL=http://host.docker.internal:8000/v1
      - LLM_MODEL_NAME=/models/gemma-4-26B-A4B-it
    extra_hosts:
      - "host.docker.internal:host-gateway"
  exam-service:
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_EMBEDDING_MODEL=bge-m3
      - EMBEDDING_DIMENSION=1024
      - LLM_BASE_URL=http://host.docker.internal:8000/v1
      - LLM_MODEL_NAME=/models/gemma-4-26B-A4B-it
    extra_hosts:
      - "host.docker.internal:host-gateway"
  script-service:
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_EMBEDDING_MODEL=bge-m3
      - EMBEDDING_DIMENSION=1024
      - LLM_BASE_URL=http://host.docker.internal:8000/v1
      - LLM_MODEL_NAME=/models/gemma-4-26B-A4B-it
    extra_hosts:
      - "host.docker.internal:host-gateway"
  presentation-service:
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_EMBEDDING_MODEL=bge-m3
      - EMBEDDING_DIMENSION=1024
      - LLM_BASE_URL=http://host.docker.internal:8000/v1
      - LLM_MODEL_NAME=/models/gemma-4-26B-A4B-it
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  ollama_data:
